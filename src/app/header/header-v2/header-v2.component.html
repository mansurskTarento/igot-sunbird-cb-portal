@if (mobileTopHeaderVisibilityStatus()) {
<div
  [ngClass]="mobileTopHeaderVisibilityStatus() ? 'mobile-download-app-top-header' : 'mobile-download-app-without-top-header'">
  <div class="cross-mobile-download-app" (click)="hideMobileTopHeader()">
    <span>X</span>
  </div>
  <div class="kb-symbol">
    <img src="/assets/icons/top-nav/KB-Symbol_icon.svg" alt="">
  </div>
  <div class="mobile-download-app-desc">
    <p class="mobile-download-app-desc-heading">iGot Karmayogi</p>
    <p class="mobile-download-app-desc-sub-heading">Download the mobile app</p>
  </div>
  <div class="flex-1 flex justify-end pr-4">
    <li class="download-app-chip-top-header" (click)="downloadApp()">
      <span>Download App </span>
    </li>
  </div>
</div>
}
<div class="w-full">
  <ws-app-nav-bar-v2 [ngClass]="mobileTopHeaderVisibilityStatus() ? 'top-nav-bar':'top-nav-bar-without-mobile-header'"
    [mode]="'top'" [headerFooterConfigData]="headerFooterConfigData"
    [leftNavBarOpen]="leftNavBarOpen()"></ws-app-nav-bar-v2>
  <ng-container *ngIf="showHubs && domainConfSvc.isConfigEnabled('components.secondaryHeader', 'enabled')">
    <ws-widget-grid-layout [widgetData]="widgetData" [fromHeader]="true"></ws-widget-grid-layout>
  </ng-container>
</div>
