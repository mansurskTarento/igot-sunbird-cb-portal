<!-- ===== LOADING SKELETON ===== -->
<div class="ip-card" *ngIf="isLoading" aria-hidden="true">
  <div class="ip-ring-wrap">
    <div class="ip-skeleton ip-sk-circle"></div>
  </div>
  <div class="ip-details">
    <div class="ip-skeleton ip-sk-badge"></div>
    <div class="ip-skeleton ip-sk-title"></div>
    <div class="ip-skeleton ip-sk-sub"></div>
    <div class="ip-skeleton ip-sk-btn"></div>
  </div>
</div>

<!-- ===== COURSE CARD ===== -->
<div class="ip-card" *ngIf="!isLoading && course" role="article"
  [attr.aria-label]="courseName + ', ' + progressPercent + '% complete, In Progress'">

  <span class="ip-retired-ribbon" *ngIf="isRetired" role="status">{{ 'continueLearning.retired' | translate }}</span>

  <!-- Circular SVG ring — decorative; percentage is announced via the span below -->
  <div class="ip-ring-wrap" aria-hidden="true">
    <svg class="ip-ring-svg" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" focusable="false">
      <circle class="ip-ring-bg" cx="36" cy="36" r="30" stroke-width="5" fill="none" />
      <circle class="ip-ring-fg" cx="36" cy="36" r="30" stroke-width="5" fill="none" stroke-linecap="round"
        [style.stroke-dasharray]="circumference" [style.stroke-dashoffset]="strokeDashoffset"
        transform="rotate(-90 36 36)" />
    </svg>
    <span class="ip-ring-pct" aria-hidden="true">{{ progressPercent }}%</span>
  </div>

  <!-- Details -->
  <div class="ip-details">
    <span class="ip-in-progress-badge" aria-hidden="true">{{ 'continueLearning.inProgress' | translate }}</span>
    <p class="ip-title">{{ courseName }}</p>
    <p class="ip-org" *ngIf="courseOrg">{{ courseOrg }}</p>
    <button class="ip-resume-btn" [class.ip-resume-btn--disabled]="isRetired" [disabled]="isRetired"
      [attr.aria-label]="'Resume ' + courseName + ', ' + progressPercent + '% complete'" (click)="resume()">{{
      'continueLearning.resume' | translate }}</button>
  </div>
</div>
