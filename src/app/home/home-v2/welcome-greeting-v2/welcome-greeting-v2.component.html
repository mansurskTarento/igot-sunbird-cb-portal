@if (userName) {
<div class="wg-container" role="region" aria-label="Welcome greeting">
  @if (isFirstLogin) {
  <span class="wg-text" aria-live="polite" [attr.aria-label]="'Welcome, ' + userName">
    {{ 'welcomegreeting.welcome' | translate }} {{ userName | titlecase }}
  </span>
  } @else {
  <span class="wg-text" aria-live="polite" [attr.aria-label]="'Welcome Back, ' + userName">
    {{ 'welcomegreeting.welcomeBack' | translate }} {{ userName | titlecase }}
  </span>
  }
</div>
}
