<!-- Overlay backdrop -->
<div class="filter-overlay" (click)="closeFilter()"></div>

<!-- Filter panel -->
<div class="filter-md">
  <!-- Header -->
  <div class="filter-header flex justify-between items-center">
    <span class="label text-lg">Filters</span>
    <mat-icon class="cursor-pointer" (click)="closeFilter()">close</mat-icon>
  </div>

  <div class="filter-content-container filter">
    <!-- Competency Area Section -->
    <div class="filter-content">
      <mat-expansion-panel [expanded]="true">
        <mat-expansion-panel-header>
          <mat-panel-title>Competency Area</mat-panel-title>
        </mat-expansion-panel-header>

        <div class="category-content">
          <div class="category-item" *ngFor="let area of competencyAreas">
            <mat-checkbox [checked]="area.selected" (change)="onAreaChange(area, $event.checked)">
              {{ area.name }}
            </mat-checkbox>
          </div>
        </div>
      </mat-expansion-panel>
    </div>

    <div class="spacer"></div>

    <!-- Competency Theme Section -->
    <div class="filter-content">
      <mat-expansion-panel [expanded]="true">
        <mat-expansion-panel-header>
          <mat-panel-title>Competency Theme</mat-panel-title>
        </mat-expansion-panel-header>

        <div class="rsearch">
          <mat-icon class="search-icon">search</mat-icon>
          <input class="sinput" type="text" placeholder="Enter competency theme" [(ngModel)]="themeSearchText" (input)="filterThemes()" />
        </div>

        <div class="category-content" style="margin-top: 8px;">
          <div class="category-item" *ngFor="let theme of filteredThemes">
            <mat-checkbox [checked]="theme.selected" (change)="onThemeChange(theme, $event.checked)">
              {{ theme.name }}
            </mat-checkbox>
          </div>
          <div *ngIf="filteredThemes.length === 0" class="category-item" style="text-align: center; color: #999;">
            No themes found
          </div>
        </div>
      </mat-expansion-panel>
    </div>
  </div>

  <!-- Footer with Clear & Apply -->
  <div class="filter-footer flex justify-center gap-4 p-4" style="width: 352px;">
    <button class="filter-clear" (click)="clearFilters()">Clear</button>
    <button class="filter-apply" (click)="applyFilters()">Apply</button>
  </div>
</div>
