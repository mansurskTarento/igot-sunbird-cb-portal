<ng-container *ngIf="showFooter">
  <ws-footer-section *ngIf="showLinks && !hideFooterSection()" [environment]="environment" [hubsList]="hubsList"
    [headerFooterConfigData]="headerFooterConfigData"></ws-footer-section>

  <div *ngIf="showCopyright" class="mat-toolbar ws-mat-primary-text"
    [ngClass]="isHomePage ? 'footer-container-home' : 'footer-container'">
    <div class="mat-body text-center flex-1">
      <ng-container>
        <div class="copyright-content">
          <div class="copyright-logo">
            <ws-app-logo [classList]="'logo-dim app-logo'" [path]="redirectPath" [logoSrc]="logoSrc"></ws-app-logo>
          </div>
          <div class="copyright">
            <span class="font-14">&copy; {{ 'footer.copyright' | translate }} 2026-2027</span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</ng-container>
