<div *ngIf="configSvc.globalConfigLoadFailed" class="global-config-error-screen">
  <div class="global-config-error-box">
    <div class="global-config-error-icon">⚠</div>
    <h1 class="global-config-error-title">Application Error</h1>
    <p class="global-config-error-message">Something went wrong while loading the application. Please try again.</p>
    <button class="global-config-error-btn" (click)="reloadPage()">Refresh Page</button>
  </div>
</div>
<ng-container *ngIf="!configSvc.globalConfigLoadFailed">
  <div class="flex gap-0 root-container">
    @if ((isXSmall$ | async) === false && showMenuBardetails) {
    <div class="w-fit">
      <sb-uic-dynamic-sidebar [menuBarDetails]="menuBarDetails" [detailsChanged]="detailsChanged()"
        [otherDetailsChanged]="otherDetailsChanged()" [navBarOpenStatus]="navBarOpenStatusBasedOnNav()"
        (sidebarStateChange)="sidebarStateChanged($event)"
        (navItemClicked)="onNavItemClicked($event)"></sb-uic-dynamic-sidebar>
    </div>
    }
    <div class=""
      [ngClass]="((isXSmall$ | async) === true || !showMenuBardetails) ? 'w-full' : (leftNavBarIsOpen() ? 'main-content-on-menubar-open' : 'main-content-on-menubar-close')">
      <app-tour *ngIf="loggedinUser && !showTour && !disableHeightOnTop && isDialogEnabled('tour')"></app-tour>
      <app-no-connection></app-no-connection>
      <mat-progress-bar mode="indeterminate" color="warn" class="route-change" *ngIf="routeChangeInProgress">
      </mat-progress-bar>
      <!-- <p class="skipnav">
      <a href="javascript:void(0);" (click)='skipToMainContent()' translate>
        Skip to main content
      </a>
    </p> -->
      <!-- <ws-app-public-nav-bar *ngIf=""></ws-app-public-nav-bar> -->
      <!-- <ws-widget-sticky-header> -->
      <!-- <ws-app-nav-bar class="top-nav-bar" *ngIf="navBarRequired && (isXSmall$ | async) === false" [hidden]="!isShowNavbar" [mode]="'top'"></ws-app-nav-bar> -->
      <!-- <ws-header *ngIf="navBarRequired && !hideHeaderAndFooter && domainConfSvc.isConfigEnabled('components.header', 'enabled')"
      [hidden]="!isShowNavbar" [mode]="'top'" [headerFooterConfigData]="headerFooterConfigData" [showHubs]="showHubs">
  </ws-header> -->
      @if (showHeader) {
      <ws-header-v2 class="block w-full" [leftNavBarOpen]="leftNavBarIsOpen()"
        [headerFooterConfigData]="headerFooterConfigData">
      </ws-header-v2>
      }
      <!-- </ws-widget-sticky-header> -->
      <div class="mx-4 flex justify-center mobileTopVisableHeightAdjust" [ngClass]="{
        'height-adjust': showHeader,
        'mobileTopVisableHeightAdjust': mobileTopHeaderVisibilityStatus,
      'height-on-bottom custom-scroll':
        (isXSmall$ | async) === true &&  true && isShowNavbar,
        'height-adjust-setup' : isSetupPage,
      'height-on-top':
        (isXSmall$ | async) === false &&
        isShowNavbar &&
        navBarRequired &&
        !isCustomHeight && !hideHeaderAndFooter && !disableHeightOnTop &&
    domainConfSvc.isConfigEnabled('components.marquee', 'enabled'),
  'height-on-top-no-marquee':
    (isXSmall$ | async) === false &&
    isShowNavbar &&
    navBarRequired &&
        !isCustomHeight && !hideHeaderAndFooter && !disableHeightOnTop &&
        !domainConfSvc.isConfigEnabled('components.marquee', 'enabled'),
  'height-no-secondary':
    (isXSmall$ | async) === false &&
    isShowNavbar &&
    navBarRequired &&
    !isCustomHeight && !hideHeaderAndFooter && !disableHeightOnTop &&
    !domainConfSvc.isConfigEnabled('components.secondaryHeader', 'enabled'),
      'height-on-top-not-valid-user': (isXSmall$ | async) === false && disableHeightOnTop
    }">

        <div [ngClass]="{
            'margin186': mobileTopHeaderVisibilityStatus && showHubs,
            'mt-0': !mobileTopHeaderVisibilityStatus && showHubs,
            'mt-136': mobileTopHeaderVisibilityStatus && !showHubs && !viewerPage && !hideHeaderAndFooter,
            'mt-4': !mobileTopHeaderVisibilityStatus && !showHubs && !viewerPage,
            'container-balanced': !isHomePage() && !showFullScreen(),
            'home-content': showMenuBardetails && isHomePage() && !showFullScreen(),
            'w-full': !showMenuBardetails || showFullScreen()
            }">
          <router-outlet></router-outlet>
        </div>
      </div>

      <!-- <ws-app-footer class="app-footer" [ngClass]="{ 'padding-bottom: 56px': !isSetupPage}" *ngIf="showNavbar"></ws-app-footer> -->
      <!--  && domainConfSvc.isConfigEnabled('featureFlags', 'chatbot') -->
      <ws-app-chatbot *ngIf="!hideHeaderAndFooter" [rootOrgId]="configSvc?.unMappedUser?.rootOrgId"></ws-app-chatbot>
      <ws-app-footer class="app-footer"
        *ngIf="showNavbar && showFooter && headerFooterConfigData && !hideHeaderAndFooter" [isHomePage]="isHomePage()"
        [hideFooterSection]="hideFooterSection" [headerFooterConfigData]="headerFooterConfigData">
      </ws-app-footer>

      <ws-app-nav-bar-v2 class="bottom-nav-bar" [hidden]="!isShowNavbar || !showBottomNav"
        (viewAchivements)="viewAllAchievements()"
        *ngIf="navBarRequired && (isXSmall$ | async) === true && !hideHeaderAndFooter" [mode]="'bottom'">
      </ws-app-nav-bar-v2>
      <ng-container #previewContainer></ng-container>
      <input #appUpdateTitle type="hidden" i18n-value value="App Update" />
      <input #appUpdateBody type="hidden" i18n-value value="App has been updated. Do you want to load new version?" />
      <div #skipper tabindex="-1"></div>
    </div>

    @if (showKarmaLeaderboard()) {
    <div class="klb-popup-backdrop" [@fadeBackdrop] aria-hidden="true"></div>
    <div class="klb-popup-panel" [@slidePanel] role="dialog" aria-modal="true" aria-label="Karma Leaderboard">
      <ws-karma-leaderboard-v2 (close)="showKarmaLeaderboard.set(false)"></ws-karma-leaderboard-v2>
    </div>
    }
  </div>
</ng-container>
