<div class="filter-sidebar padding-m">
  <!-- Header with Filter By and Clear All -->
  <div class="flex items-center justify-between" *ngIf="showHeader">
    <p class="mat-subheading-1 margin-bottom-s font-bold-imp text-dark">
      {{ headerTitle | translate }}
    </p>
    <button *ngIf="showClearAllGlobal && filtersAppliedCount > 0" mat-flat-button (click)="clearAllFilters()"
      class="margin-bottom-s clear-all-btn text-sm font-normal">
      {{ 'gyaanKarmayogi.clearAll' | translate }}
    </button>
  </div>

  <!-- Applied Filter Chips -->
  <div class="filter-list flex items-center flex-wrap gap-2" *ngIf="filtersAppliedCount > 0">
    <ng-container *ngFor="let chip of selectedFilterChips; trackBy: trackByFn">
      <div class="filter-pill flex items-center">
        <span class="font-normal text-xs" [matTooltip]="chip.displayName">{{ chip.displayName }}</span>
        <button mat-icon-button color="primary" (click)="clearFilterChip(chip)">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </ng-container>
  </div>

  <!-- Filter Sections -->
  <ng-container *ngFor="let config of filterConfig; trackBy: trackByFn">
    <div class="filter-section-container" *ngIf="config.options && config.options.length > 0">
      <!-- Section Header -->
      <div class="flex items-center justify-between">
        <p class="mat-subheading-1 mt-4 font-bold-imp text-dark mb-2">{{ config.heading }}</p>
        <button *ngIf="config.showClearAll && selectedFilters[config.key]?.length > 0" mat-flat-button
          (click)="clearSectionFilters(config.key)" class="section-clear-btn text-xs">
          {{ 'gyaanKarmayogi.clearAll' | translate }}
        </button>
      </div>

      <!-- Search Input -->
      <div class="mat-full-radius mb-2" *ngIf="config.showSearch && config.options.length > 4">
        <mat-form-field appearance="outline" class="search-input-block">
          <input matInput class="search-filter-input" placeholder="Search" [(ngModel)]="searchQueries[config.key]">
          <mat-icon matPrefix class="search-icon">search</mat-icon>
        </mat-form-field>
      </div>

      <!-- Checkbox Selection -->
      <ng-container *ngIf="config.selectType === 'checkbox' || !config.selectType">
        <mat-selection-list class="padding-top-0">
          <section class="mat-body-2 text-capitalize"
            *ngFor="let option of getFilteredOptions(config); trackBy: trackByFn">
            <mat-checkbox [checked]="option.isChecked || getSelectedFilter(option, config.key)"
              (change)="onSelectionFilter($event, option, config.key)">
              <span class="min-width-adjust" [matTooltip]="option.displayName || capitalizeFirstLetter(option.name)"
                [matTooltipPosition]="'right'">
                {{ option.displayName || capitalizeFirstLetter(option.name) }}
              </span>
              <span class="min-width-adjust" *ngIf="config.showCount !== false && option.count !== undefined">
                {{ ' (' + option.count + ')' }}
              </span>
            </mat-checkbox>
          </section>
        </mat-selection-list>
      </ng-container>

      <!-- Radio Selection -->
      <ng-container *ngIf="config.selectType === 'radio'">
        <mat-radio-group>
          <section class="mat-body-2 text-capitalize"
            *ngFor="let option of getFilteredOptions(config); trackBy: trackByFn">
            <mat-radio-button [value]="option" [checked]="option.isChecked || getSelectedFilter(option, config.key)"
              (change)="onRadioChange(option, config.key)">
              <span class="min-width-adjust" [matTooltip]="option.displayName || capitalizeFirstLetter(option.name)"
                [matTooltipPosition]="'right'">
                {{ option.displayName || capitalizeFirstLetter(option.name) }}
              </span>
              <span class="min-width-adjust" *ngIf="config.showCount !== false && option.count !== undefined">
                {{ ' (' + option.count + ')' }}
              </span>
            </mat-radio-button>
          </section>
        </mat-radio-group>
      </ng-container>

      <!-- See More / See Less -->
      <button *ngIf="hasMoreOptions(config) && config.showSeeMore !== false"
        class="brand-color underline cursor-pointer see-more-link" (click)="toggleShowMore(config.key)">
        {{ showAllMap[config.key] ? 'See Less' : 'See More' }}
      </button>
    </div>
  </ng-container>
</div>
