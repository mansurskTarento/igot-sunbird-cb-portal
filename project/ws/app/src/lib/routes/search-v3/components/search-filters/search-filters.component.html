<div class="filter-sidebar padding-m">
    <p class="mat-subheading-1 margin-bottom-m font-bold-imp text-dark">{{'searchfilters.filterBy' | translate}}</p>
    <p class="mat-subheading-1 mt-4 font-bold-imp text-dark">{{'searchfilters.categoryType' | translate}}</p>

    <form class="filter-form">
        <!-- <mat-accordion class="filter-section margin-bottom-m" *ngFor="let fs of filteroptions" open> -->
        <mat-accordion class="filter-section margin-bottom-m">
            <ng-container *ngFor="let category of (showAll ? categoryType : categoryType.slice(0, 4))">
                <mat-expansion-panel *ngIf="category.filters.length > 0" class="">
                    <mat-expansion-panel-header class="padding-remove">
                        <mat-panel-title>
                            <p class="expansion-heading font-normal text-sm">{{ category.displayName }}</p>
                        </mat-panel-title>
                    </mat-expansion-panel-header>
                    <mat-selection-list>
                        <section class="mat-body-2 margin-bottom-xs text-capitalize"
                            *ngFor="let options of category.filters">
                            <mat-checkbox [checked]="options.ischecked">
                                <label>{{ options.displayName }}</label>
                            </mat-checkbox>
                        </section>
                    </mat-selection-list>
                </mat-expansion-panel>
            </ng-container>
        </mat-accordion>

        <!-- Show More / Show Less Button -->
        <div class="brand-color underline" (click)="toggleShowMore()">
            {{ showAll ? 'See Less' : 'See More' }}
        </div>

    </form>
</div>
<!-- categoryType -->
