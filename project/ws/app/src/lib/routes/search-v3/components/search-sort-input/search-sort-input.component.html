<!-- sort-by.component.html -->
<div class="sort-by-container">
    <label for="sortSelect" class="sort-by-label pl-2">Sort By</label>
    <div class="select-wrapper">
        <select id="sortSelect" [(ngModel)]="selectedOption" (change)="onChange($event)" class="sort-select">
            <option *ngFor="let option of options" [value]="option.value">
                {{ option.name }}
            </option>
        </select>
    </div>
</div>
