<div class="sort-by-container">
    <label for="sortSelect" class="sort-by-label">Sort By</label>
    <div class="select-wrapper">
        <select #sortSelect id="sortSelect" [(ngModel)]="selectedOption" (change)="onChange($event)"
            class="sort-select">
            <option *ngFor="let option of options" [value]="option.value">
                {{ option.name }}
            </option>
        </select>
    </div>
</div>
