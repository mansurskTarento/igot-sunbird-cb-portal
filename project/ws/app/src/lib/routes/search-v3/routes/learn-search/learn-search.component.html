<div class="learnsearch  margin-top-l margin-bottom-l">
    <mat-sidenav-container autosize class="container-balanced" [hasBackdrop]="false">
        <mat-sidenav [mode]="'side'" [opened]="sideNavBarOpened && totalResults !== 0" position="start"
            class="custom-sidenav" *ngIf="(!filtersPanel || filtersPanel !=='hide') && totalResults !== 0">
            <ng-container>
                <ws-app-search-filters *ngIf="facets && facets.length > 0" [urlparamFilters]="paramFilters"
                    [newfacets]="facets" (appliedFilter)="applyFilter($event)"
                    [karmayogiBadge]="veifiedKarmayogi"></ws-app-search-filters>
            </ng-container>
        </mat-sidenav>

        <mat-sidenav-content class="custom-sidecontent" [ngClass]="{'full': filtersPanel && filtersPanel ==='hide'}">
            <div class="ml-4">
                <div class="result-meta my-3">
                    <div class="" *ngIf="totalResults > 0">
                        <span class="brand-color">"{{totalResults}}"</span>
                        <span class="mx-1">{{'learnsearch.searchResultsFor' | translate}}</span>
                        <span class="brand-color" *ngIf="param">{{param}}'</span>
                    </div>
                </div>

                <div *ngIf="screenSizeIsLtMedium" class="flex justify-start">
                    <button type="button" mat-icon-button (click)="sideNavBarOpened = !sideNavBarOpened"
                        id="ws-auth-root-home-btn-menu" name="ws-auth-root-home-btn-menu">
                        <mat-icon>menu</mat-icon>
                    </button>
                </div>

                <ng-container *ngIf="totalResults > 0">
                    <!-- Content Card -->
                    <ng-container>
                        <div class="search-content-card">
                            <p class="mat-subheading-1 mt-4 font-bold-imp text-dark">{{'Content(4)' | translate}}</p>
                            <ng-container>
                                <ws-app-course-content-card></ws-app-course-content-card>
                            </ng-container>
                        </div>
                    </ng-container>
    
                    <!-- event Card -->
                    <ng-container>
                        <div class="search-event-card">
                            <p class="mat-subheading-1 mt-4 font-bold-imp text-dark">{{'Events(4)' | translate}}</p>
                            <ng-container>
                                <ws-app-search-event-card></ws-app-search-event-card>
                            </ng-container>
                        </div>
                    </ng-container>
                </ng-container>

            </div>

            <div class="ml-auto mr-auto mt-8 text-center max-w-330" *ngIf="totalResults === 0">
                <img src="/assets/icons/no-data.svg" wsUtilsImageResponsive alt="No results"
                    class="margin-top-l margin-bottom-s">
                <div class="no-data-text font-bold text-sm my-4" i18n="search route no result">
                    {{ noResultMessage }}</div>
                <div class="no-data-text font-bolder text-sm" i18n="search route you may try">{{'learnsearch.extraText1'
                    | translate}}</div>
                <div class="no-data-text font-bolder text-sm" i18n="search route you may try">{{'learnsearch.extraText2'
                    | translate}}</div>
                <div class="action-search-btn flex gap-4 items-center mt-6">
                    <button mat-raised-button class="mat-btn-outline cursor-pointer py-1"
                        (click)="navigateTo('page/home')">
                        {{'learnsearch.btnBackToHomepage' | translate}}</button>
                    <button mat-flat-button class="mat-btn-flat cursor-pointer py-1">
                        {{'learnsearch.btnExploreMore' | translate}}</button>
                </div>

            </div>


        </mat-sidenav-content>


    </mat-sidenav-container>
</div>
