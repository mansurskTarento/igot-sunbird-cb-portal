<div class="calendar-container flex flex-col gap-4">
    <div class="header">My Event Calendar</div>
    <div class="month-selector flex items-center justify-between">
        <mat-icon (click)="prevMonth()">chevron_left</mat-icon>
        <span>{{ getMonthYearText }}</span>
        <mat-icon (click)="nextMonth()">chevron_right</mat-icon>
    </div>

    <div class="calendar-grid">
        <div class="weekday-header">
            <div *ngFor="let day of weekdays" class="weekday">{{ day }}</div>
        </div>

        <div class="days-grid">
            <div *ngFor="let date of daysInMonth" class="day-cell" [class.current-month]="isCurrentMonth(date)"
                [class.today]="isToday(date)" [class.has-event]="hasEvent(date)"
                [class.selected]="selected && date.getDate() === selected.getDate() && date.getMonth() === selected.getMonth()"
                (click)="selectDate(date)">
                {{ date.getDate() }}
            </div>
        </div>
    </div>

    <div class="today-events mt-2 flex flex-col gap-3">
        <div class="today">Today</div>
        <ng-container *ngFor="let event of eventsList | slice:0:2">
            <div class="event-item flex flex-col gap-3 pb-3">
                <div class="flex justify-between items-center">
                    <div class="eventName">{{event.eventName}}</div>
                    <ng-container *ngIf="!event.eventTime">
                        <div class="flex gap-1 live">
                            <img src="/assets/icons/live.svg" alt="">
                            <span>Live</span>
                        </div>
                    </ng-container>
                </div>
                <span class="eventDescription">{{event.eventDescription}}</span>
                <ng-container *ngIf="event.eventTime">
                    <div class="event-time">
                        <mat-icon class="event-time-icon">schedule</mat-icon>
                        <span>{{event.eventTime}}</span>
                    </div>
                </ng-container>
            </div>
        </ng-container>
    </div>
</div>
