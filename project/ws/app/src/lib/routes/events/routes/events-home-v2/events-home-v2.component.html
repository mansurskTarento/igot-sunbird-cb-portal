<div  class="container-balanced">
    <ng-container *ngIf="banner && banner.enabled">
        <ng-container [wsResolverWidget]="banner?.data"></ng-container>
    </ng-container>
    <ng-container *ngIf="eventsHome && eventsHome.enabled">
        <div class="flex flex-col px-4 md:px-0 md:flex-row gap-6 mt-4">
            <ng-container *ngIf="eventsHome?.data?.leftSection?.enabled">
                <div class="block md:hidden ">
                    <div class="flex gap-3">
                        <div *ngIf="eventsHome?.data?.leftSection?.data?.myEngagements?.enabled" class="mEngagementCard flex items-center justify-center p-2"
                        (click)="openEventEngagementBottomSheet()">
                            <div class="flex flex-col gap-3 items-center">
                                <img class="engagement-icon" src="/assets/icons/events_attended.svg" alt="">
                                <span>{{eventsHome?.data?.leftSection?.data?.myEngagements?.mTitle}}</span>
                            </div>
                        </div>
                        <div *ngIf="eventsHome?.data?.leftSection?.data?.eventsCalendar?.enabled" class="mEngagementCard flex items-center justify-center p-2"
                        (click)="openEventCalendartBottomSheet()">
                            <div class="flex flex-col gap-3 items-center">
                                <img class="engagement-icon" src="/assets/icons/calendar.svg" alt="">
                                <span>{{eventsHome?.data?.leftSection?.data?.eventsCalendar?.mTitle}}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="hidden md:block">
                    <div class="left flex flex-col gap-5">
                        <div *ngIf="eventsHome?.data?.leftSection?.data?.myEngagements?.enabled">
                            <ws-app-events-engagement [myEngagements]="eventsHome?.data?.leftSection?.data?.myEngagements" [engagementDetails]="engagementDetails"></ws-app-events-engagement>
                        </div>
                        <div *ngIf="eventsHome?.data?.leftSection?.data?.eventsCalendar?.enabled">
                            <ws-app-events-calendar></ws-app-events-calendar>
                        </div>
                    </div>
                </div>
            </ng-container>
            <div class="flex flex-col gap-6 right">
                <div class="search">
                    <div class=rsearch>
                    <mat-icon class="search-icon">search</mat-icon>
                    <input class="sinput w-full" type="Standard" label="" [formControl]="searchControl"
                        placeholder="search events">
                    </div>
                </div>

                <div class="category-header">
                    Browse Events By Categories
                </div>

                <div class="flex gap-4">
                    <div class="flex gap-3 px-3 items-center categories-card">
                        <img src="/assets/icons/karmayogi_sapth_logo.svg">
                        Karmayogi Saptah
                    </div>
                    <div class="flex gap-3 px-3 items-center categories-card">
                        <img src="/assets/icons/karmayogi_talks_logo.svg">
                        Karmayogi Talks
                    </div>
                    <div class="flex gap-3 px-3 items-center categories-card">
                        <img src="/assets/icons/all_events.svg">
                        All Events
                    </div>
                </div>

                <!-- <ng-container *ngFor="let widgetData of eventsHome?.data?.rightSection?.data?.eventStrips">
                    <ng-container *ngIf="widgetData && widgetData.enabled">
                        <sb-uic-content-strip-with-tabs-pills [widgetData]="widgetData"
                            (telemtryResponse)="raiseTelemetryInteratEvent($event)"></sb-uic-content-strip-with-tabs-pills>
                    </ng-container>
                </ng-container> -->

                <ng-container *ngFor="let widgetData of dummyWidgetData?.column">
                    <ng-container *ngIf="widgetData && widgetData.enabled">
                        <sb-uic-content-strip-with-tabs 
                            (telemtryResponse)="raiseTelemetryInteratEvent($event)"
                            [widgetData]="widgetData.data">
                        </sb-uic-content-strip-with-tabs>
                    </ng-container>
                </ng-container>
                <!-- <sb-uic-content-strip-with-tabs 
                    (telemtryResponse)="raiseTelemetryInteratEvent($event)"
                    [widgetData]="dummyWidgetData.column[0].data">
                </sb-uic-content-strip-with-tabs> -->

            </div>
        </div>
    </ng-container>
</div>
