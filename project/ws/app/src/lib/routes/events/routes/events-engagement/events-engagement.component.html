<div class="p-4 flex flex-col gap-4 engagement-card">
    <div class="pb-4 engagement-header">{{myEngagements?.title}}</div>
    <div class="flex gap-6">
        <ng-container *ngFor="let element of myEngagements?.data">
            <div class="flex flex-col gap-2">
                <img class="engagement-icons" [src]="element?.icon" alt="">
                <div class="events-attended">{{element?.title}}</div>
                <div class="events-value">{{getValue(element?.key)}}</div>
            </div>
        </ng-container>
    </div>
</div>
