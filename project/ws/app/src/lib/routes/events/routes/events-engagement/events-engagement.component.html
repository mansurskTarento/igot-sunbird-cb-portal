<div class="md:p-4 flex flex-col gap-4 engagement-card">
    <div class="md:pb-4 engagement-header">
        <div class="block md:hidden ">
            <mat-icon class="backArrow" (click)="closeDiaolg()">arrow_back</mat-icon>
        </div> {{myEngagements?.title}}
    </div>
    <div class="flex flex-col md:flex-row gap-6">
        <ng-container *ngFor="let element of myEngagements?.data">
            <div class="hidden md:block ">
                <div class="flex flex-col gap-2">
                    <img class="engagement-icons" [src]="element?.icon" alt="">
                    <div class="events-attended">{{element?.title}}</div>
                    <div class="events-value">{{getValue(element?.key)}}</div>
                </div>
            </div>
            <div class="block md:hidden">
                <div class="flex justify-center items-center w-full engagement-details-card">
                    <div class="engagement-icons-div flex items-center justify-center ml-4">
                        <img class="mEngagement-icons" [src]="element?.icon" alt="">
                    </div>
                    <div class="flex flex-col gap-2 w-full">
                        <div class="mEvents-attended">{{element?.title}}</div>
                        <div class="mEvents-value">{{getValue(element?.key)}}</div>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</div>
