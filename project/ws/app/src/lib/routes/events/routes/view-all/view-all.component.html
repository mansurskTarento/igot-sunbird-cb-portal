<ws-widget-btn-page-back [widgetData]="{ url: 'home', titles: titles  }">
</ws-widget-btn-page-back>

<div class="events-see-all-wrapper">
  <div class="flex ">
    <div class="container-balanced w-full">
      <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 md:col-span-9"></div>
        <!-- hidden md:block -->
        <div class="col-span-3">
          <div class="w-72 bg-white p-4 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
              <div class="filter-heading">Filter by</div>
              <div class="clear cursor-pointer" (click)="clearAll()">Clear all</div>
            </div>

            <form [formGroup]="filterForm" (ngSubmit)="onSubmit()">
              <!-- Event Type -->
              <div class="mb-6" formGroupName="eventType">
                <div class="filter-sub-heading mb-2">Event Type</div>
                <div class="relative">
                  <input type="text" formControlName="searchTerm" placeholder="Search Event"
                    class="p-2 pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-black-500">
                </div>

                <div class="mt-2 space-y-2">
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="karmayogiTalks" class="form-checkbox text-blue-600">
                    <span>Karmayogi Talks</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="karmayogiSaptah" class="form-checkbox text-blue-600">
                    <span>Karmayogi Saptah</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="webinar" class="form-checkbox text-blue-600">
                    <span>Webinar</span>
                  </label>
                </div>
                <div></div>
                <button type="button" class="text-blue-600 text-sm mt-2 hover:text-blue-800">View All</button>
              </div>

              <!-- Event Status -->
              <div class="mb-6" formGroupName="eventStatus">
                <h3 class="text-gray-700 font-medium mb-2">Event Status</h3>
                <div class="space-y-2">
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="upcoming" class="form-checkbox text-blue-600">
                    <span>Upcoming</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="live" class="form-checkbox text-blue-600">
                    <span>Live Event</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="past" class="form-checkbox text-blue-600">
                    <span>Past Event</span>
                  </label>
                </div>
              </div>

              <!-- Event Format -->
              <div class="mb-6" formGroupName="eventFormat">
                <h3 class="text-gray-700 font-medium mb-2">Event Format</h3>
                <label class="flex items-center space-x-2">
                  <input type="checkbox" formControlName="online" class="form-checkbox text-blue-600">
                  <span>Online</span>
                </label>
              </div>

              <!-- Event Date/Time -->
              <div class="mb-6" formGroupName="eventDateTime">
                <h3 class="text-gray-700 font-medium mb-2">Event Date/Time</h3>
                <div class="space-y-2">
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="today" class="form-checkbox text-blue-600">
                    <span>Today</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="tomorrow" class="form-checkbox text-blue-600">
                    <span>Tomorrow</span>
                  </label>
                </div>
              </div>

              <!-- Date Range Picker -->
              <div class="mb-6" formGroupName="dateRange">
                <h3 class="text-gray-700 font-medium mb-2">Choose Date Range</h3>
                <div class="space-y-3">
                  <div class="relative">
                    <input type="date" formControlName="from" placeholder="From"
                      class="w-full p-2 pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <span class="absolute right-2 top-2.5 text-gray-400 material-icons">calendar_today</span>
                  </div>
                  <div class="relative">
                    <input type="date" formControlName="to" placeholder="To"
                      class="w-full p-2 pr-8 border rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <span class="absolute right-2 top-2.5 text-gray-400 material-icons">calendar_today</span>
                  </div>
                </div>
              </div>

              <!-- Event Duration -->
              <div class="mb-6" formGroupName="eventDuration">
                <h3 class="text-gray-700 font-medium mb-2">Event Duration</h3>
                <div class="space-y-2">
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="lessThanHour" class="form-checkbox text-blue-600">
                    <span>Less than an hour</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="twoToThree" class="form-checkbox text-blue-600">
                    <span>2-3hr</span>
                  </label>
                  <label class="flex items-center space-x-2">
                    <input type="checkbox" formControlName="threeToFive" class="form-checkbox text-blue-600">
                    <span>3hr-5hr</span>
                  </label>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
