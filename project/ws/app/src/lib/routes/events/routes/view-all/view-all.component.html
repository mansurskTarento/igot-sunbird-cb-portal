<ws-widget-btn-page-back [widgetData]="{ url: 'home', titles: titles  }">
</ws-widget-btn-page-back>

<div class="events-see-all-wrapper">
  <div class="flex ">
    <div class="container-balanced w-full">
      <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 md:col-span-9">
          <div class="flex flex-row flex-wrap justify-center md:justify-start content-container">
            <ng-container *ngIf="contentDataList.length;else noData">
              <div class="flex flex-row flex-wrap justify-center md:justify-start content-container">
                <div class="mr-2 mb-5" *ngFor="let c of contentDataList">
                  <ws-widget-event-card-v2 [widgetData]="c?.widgetData">
                  </ws-widget-event-card-v2>
                </div>
              </div>
            </ng-container>
            <ng-template #noData>
              <div class="flex justify-center w-full">
                <div class="margin-xl text-center">
                  <img src="/assets/common/error-pages/empty_search.svg" wsUtilsImageResponsive alt="No results"
                    class="margin-top-l margin-bottom-s">
                  <h2 class="mat-h2" i18n="search route no result">{{'learnsearch.noResults' |
                    translate}}</h2>
                  <h3 class="mat-h3" i18n="search route you may try">{{'learnsearch.removeFilters' |
                    translate}}</h3>
                </div>
              </div>
            </ng-template>
          </div>
        </div>
        <!-- hidden md:block -->
        <div class="col-span-3">
          <div class="w-72 bg-white p-4 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
              <div class="filter-heading">Filter by</div>
              <div class="clear cursor-pointer" (click)="clearAll()">Clear all</div>
            </div>
            <ng-container *ngFor="let facet of facetsData  | keyvalue:returnZero">
              <div class="individual-block">
                <div class="list mb-4">
                  <ng-container *ngIf="facet?.value?.name === 'Event Type'">
                    <div *ngIf="facet?.value?.values?.length">
                      <p class="filter-heading mb-4">{{facet?.value?.displayName}}</p>
                      <ng-container
                        *ngFor="let eType of (!facet.viewMore ? facet?.value?.values.slice(0,2) : facet?.value?.values); index as i">
                        <div class="check-list">
                          <mat-checkbox [checked]="canCheck(facet?.key, eType)"
                            (change)="changeSelection($event?.checked,facet?.key, eType, facet?.value?.values)"
                            class="mat-gyaan-filter">{{eType.name}}</mat-checkbox>
                        </div>
                      </ng-container>
                      <ng-container *ngIf="!facet.viewMore && facet?.value?.values?.length > 2">
                        <div class="pt-3">
                          <span class="view-more" (click)="facet.viewMore = true">View All</span>
                        </div>
                      </ng-container>
                      <ng-container *ngIf="facet.viewMore">
                        <div class="pt-3">
                          <span class="view-more" (click)="facet.viewMore = false">View Less</span>
                        </div>
                      </ng-container>
                    </div>
                  </ng-container>
                  <ng-container *ngIf="facet?.value?.name === 'Date Range'">
                    <div *ngIf="facet?.value?.values?.length">
                      <p class="filter-heading mb-4">{{facet?.value?.displayName}}</p>
                      <ng-container *ngFor="let eType of facet?.value?.values; index as i">
                        <div class="date-list">
                          <label>{{eType?.name}}</label>
                          <mat-form-field appearance="outline" class="w-full">
                            <input matInput [matDatepicker]="startDate" placeholder="{{eType?.PlaceHolder}}">
                            <mat-datepicker-toggle matSuffix [for]="startDate"></mat-datepicker-toggle>
                            <mat-datepicker #startDate></mat-datepicker>
                          </mat-form-field>
                        </div>
                      </ng-container>
                      <div class="line my-4"></div>
                    </div>
                  </ng-container>
                  <ng-container *ngIf="facet?.value?.name !== 'Event Type' && facet?.value?.name !== 'Date Range'">
                    <div *ngIf="facet?.value?.values?.length">
                      <div class="line mb-4" *ngIf="facet?.value?.displayName === 'Event Status'"></div>
                      <p class="filter-heading mb-4">{{facet?.value?.displayName}}</p>
                      <ng-container *ngFor="let eType of facet?.value?.values; index as i">
                        <div class="check-list">
                          <mat-checkbox [checked]="canCheck(facet?.key, eType)"
                            (change)="changeSelection($event?.checked,facet?.key, eType, facet?.value?.values)"
                            class="mat-gyaan-filter">{{eType.name}}</mat-checkbox>
                        </div>
                      </ng-container>
                    </div>
                  </ng-container>
                </div>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
