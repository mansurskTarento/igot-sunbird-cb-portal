<ws-widget-btn-page-back [widgetData]="{ url: 'home', titles: titles  }">
</ws-widget-btn-page-back>

<div class="events-see-all-wrapper">
  <div class="flex ">
    <div class="container-balanced w-full">
      <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 md:col-span-9">
          <div class="flex flex-row items-center justify-between search-block mb-5 gap-4 pl-2 md:pl-0 pr-0 md:pr-5">
            <input type="text" [formControl]="searchControl" placeholder="Search Events" class="flex-1 search-input">
            <div class="md:hidden" (click)="openBottomSheet()"><mat-icon>filter_list</mat-icon></div>
          </div>
          <div class="flex justify-between mb-5 items-center">
            <div class="results-header my-4 ml-3">Events
              <span>({{contentDataList?.length}})</span>
            </div>
            <div class="item_dropdown_box pr-2 md:pr-6">
              <div class="flex flex-1 flex-wrap section-input">
                <div class="item">
                  <mat-menu #appMenu="matMenu">
                    <button (click)="sortType('asc')" mat-menu-item>
                      A-Z
                    </button>
                    <button (click)="sortType('short')" mat-menu-item>
                      Shortest duration
                    </button>
                    <button (click)="sortType('long')" mat-menu-item>
                      Longest duration
                    </button>
                  </mat-menu>
                  <button type="button" mat-icon-button class="flex w-full sort-menu justify-end"
                    [matMenuTriggerFor]="appMenu">
                    <div class="flex items-center">
                      <span class="mr-1">
                        <span>Sort by</span>
                      </span>
                      <mat-icon matPrefix class="flex items-center justify-center ">sort
                      </mat-icon>
                    </div>
                  </button>
                </div>

              </div>
            </div>
          </div>
          <div class="flex flex-row flex-wrap justify-center md:justify-start content-container">
            <ng-container *ngIf="contentDataList.length;else noData">
              <div class="flex flex-row flex-wrap justify-center md:justify-start content-container">
                <div class="mr-2 mb-5" *ngFor="let c of contentDataList">
                  <ws-widget-event-card-v2 [widgetData]="c?.widgetData">
                  </ws-widget-event-card-v2>
                </div>
              </div>
            </ng-container>
            <ng-template #noData>
              <div class="flex justify-center w-full">
                <div class="margin-xl text-center">
                  <img src="/assets/common/error-pages/empty_search.svg" wsUtilsImageResponsive alt="No results"
                    class="margin-top-l margin-bottom-s">
                  <h2 class="mat-h2" i18n="search route no result">{{'learnsearch.noResults' |
                    translate}}</h2>
                  <h3 class="mat-h3" i18n="search route you may try">{{'learnsearch.removeFilters' |
                    translate}}</h3>
                </div>
              </div>
            </ng-template>
          </div>
        </div>
        <!-- hidden md:block -->
        <div class="col-span-3 hidden md:block">
          <ws-app-filters [facetsData]="facetsData" (filterChange)="filterChange($event)"></ws-app-filters>
        </div>
      </div>
    </div>
  </div>
</div>
