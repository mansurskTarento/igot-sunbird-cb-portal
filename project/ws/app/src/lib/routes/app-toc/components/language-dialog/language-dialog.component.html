<mat-dialog-content *ngIf="data && data?.from === 'openLanguageDialog'">
  <div class="flex">
    <a (click)="onSubmit()" class="ml-auto cursor-pointer"><mat-icon class="close-icon">close</mat-icon></a>
  </div>

  <mat-radio-group [(ngModel)]="selectedLanguage">
    <mat-radio-button *ngFor="let lang of data?.content" class="lang-radio-btn" [value]="lang">
      <!-- {{ lang }} -->
         {{ lang.name }}
    </mat-radio-button>
  </mat-radio-group>
  <!-- </mat-option>
    </mat-select> -->
  <!-- </mat-form-field> -->

</mat-dialog-content>
