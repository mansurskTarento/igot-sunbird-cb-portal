<div class="community-suggestions-container">
  <mat-card *ngFor="let community of communitySuggestionsList" class="community-card mb-4 flex flex-col items-center">
    <div class="flex items-center">
      <div class="mr-4">
        <ng-container *ngIf="community.imageUrl; else defaultImage">
          <img [src]="community.imageUrl" alt="logo" class="community-image">
        </ng-container>
        <ng-template #defaultImage>
          <img src="/assets/instances/eagle/app_logos/default.png" alt="default logo" class="community-image">
        </ng-template>
      </div>
      <div class="flex-grow">
        <div class="communityName">{{community?.communityName}}</div>
        <div class="community-details flex gap-4 items-center mt-1">
          <span>{{community?.countOfPeopleJoined}}K Members</span>
          <span>-</span>
          <span>{{community?.countOfPostCreated}}K Posts</span>
        </div>
        <div class="flex gap-1">
          <div class="logo flex items-center justify-center">
            <img src="/assets/instances/eagle/app_logos/Karmayogi_logo_icon.svg" alt="Karmayogi Logo" class="karmayogi-logo">
          </div>
          <div class="community-details mt-2">{{community?.orgName}}</div>
        </div>
      </div>
    </div>
    <div class="dividing-line mt-2"></div>
    <div class="connect flex justify-center items-center pt-4" (click)="viewCommunity(community)">
      <a>{{'NetworkV2Profile.viewCommunity' | translate}}</a>
    </div>
  </mat-card>
</div>
