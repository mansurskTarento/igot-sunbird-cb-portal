<div class="recommended-communities">
  <div *ngFor="let community of recommendedCommunitiesList | slice:0:3" class="community-card mat-elevation-z1">
    <div class="community-header">
      <img [src]="community.thumbnail || 'assets/images/community-default.png'" alt="community thumbnail" class="community-img">
      <div class="community-info">
        <h3 class="community-title">{{community.name}}</h3>
        <div class="community-stats">
          <span>{{community.memberCount | number}} Members</span>
          <span class="dot-separator">•</span>
          <span>{{community.postCount | number}} Posts</span>
        </div>
      </div>
    </div>
    
    <div class="community-owner">
      <img [src]="community.ownerThumbnail || 'assets/images/user-default.png'" alt="owner thumbnail" class="owner-img">
      <span>By {{community.ownerName}}</span>
    </div>

    <button mat-button color="primary" class="view-btn" [routerLink]="['/community', community.id]">
      View Community
    </button>
  </div>
</div>
