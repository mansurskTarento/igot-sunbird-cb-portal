<div class="flex flex-col gap-2">
  <div class="flex justify-between items-center">
    <div class="section-header">Educational Qualifications</div>
    <mat-icon class="add-icon">add</mat-icon>
  </div>
  <ng-container *ngFor="let educationalQualification of educationalQualificationsList">
    <div class="education-card flex flex-col gap-0">
      <div class="education">{{educationalQualification?.education}}</div>
      <div class="education-details">{{educationalQualification?.instituteAndLocation}}</div>
      <div class="education-period">{{educationalQualification?.period}}</div>
    </div>
  </ng-container>
</div>
