<div class="flex flex-col gap-2">
  <div class="flex justify-between items-center mb-2">
    <div class="section-header">Service History</div>
    <mat-icon class="add-icon" (click)="openEditDialog()">add</mat-icon>
  </div>
  <ng-container *ngFor="let service of serviceHistoryList">
    <div class="service-card flex">
      <img class="org-logo" [src]="service?.orgLogo">
      <div class="flex flex-col w-full gap-0">
        <div class="flex justify-between">
          <div class="designation">{{service?.designation}}</div>
          <mat-icon class="edit-icon" (click)="openEditDialog(service)">edit</mat-icon>
        </div>
        <div class="org-details">{{service?.orgDetails}}</div>
        <div class="org-period">{{service?.period}}</div>
      </div>
    </div>
  </ng-container>
</div>
