<div class="flex flex-col gap-2">
  <div class="flex justify-between items-center">
    <div class="section-header">Achievements</div>
    <mat-icon class="add-icon">add</mat-icon>
  </div>

  <div class="flex flex-col gap-2">
    <ng-container *ngFor="let achievement of achievementsList">
      <div class="achievement-card flex flex-col gap-1 w-full">
        <div class="flex justify-between items-center certificate-name">
          {{achievement?.certificateName}}
          <mat-icon class="edit-icon">edit</mat-icon>
        </div>
        <div class="achievement-details"> {{achievement?.provider}}</div>
        <div class="achievement-details"> {{achievement?.period}}</div>
        <ng-container *ngIf="achievement?.certificateUrl">
          <img [src]="achievement?.certificateUrl" class="certificate mt-1" alt="certificate">
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
