<div class="flex flex-col gap-2">
    <ng-container *ngFor="let achievement of achievementsList">
      <div class="achievement-card flex flex-col gap-1">
        <div class="flex justify-between items-center certificate-name">
          {{achievement?.title}}
          <mat-icon class="edit-icon" (click)="openEditDialog(achievement)">edit</mat-icon>
        </div>
        <div class="achievement-details"> {{achievement?.issuedOrganisation}}</div>
        <div class="achievement-details"> {{achievement?.issuedDate | date:'dd MMM, yyyy'}}</div>
        <ng-container *ngIf="achievement?.description">
          <div class="description my-2" [ngClass]="{'extend-description': service?.showMore}" >{{achievement?.description}}</div>
          <div class="view-more" (click)="viewMore(achievement)">
            {{achievement?.showMore ? 'view less' : 'view more'}}
          </div>
        </ng-container>
        <ng-container *ngIf="achievement?.uploadedDocumentUrl">
          <div class="document-card flex justify-between items-center">
            <div class="flex items-center gap-4">
              <img [src]="achievement?.uploadedDocumentUrl" class="certificate" alt="certificate">
              <div class="document-name">{{achievement?.fileName}}</div>
            </div>
            <mat-icon class="view-icon" (click)="openDocument(achievement?.uploadedDocumentUrl)">visibility</mat-icon>
          </div>
        </ng-container>
        <ng-container *ngIf="achievement?.url">
          <div class="url-card flex gap-2 items-center justify-center" (click)="openUrl(achievement.url)">
            <div class="linke" >View Certification</div>
            <mat-icon class="link-icon" >link</mat-icon>
          </div>
        </ng-container>
      </div>
    </ng-container>
</div>
