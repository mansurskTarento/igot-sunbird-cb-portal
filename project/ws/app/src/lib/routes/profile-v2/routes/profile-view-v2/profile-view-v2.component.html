<div class="flex flex-row gap-5">
  <!-- #region (left profile )-->
  <div class="flex flex-col gap-4 items-center justify-center profileLeftSection">
    <div class="profile">
      <div>
        <img class="cover-picture" src="./assets/images/image.svg" alt="cover-photo">
        <div class="edit-cover-picture flex justify-center items-center">
          <img src="./assets/icons/pen_white.svg" class="edit-icon" alt="edit-cover-photo">
        </div>
      </div>
      <div class="profile-details p-4 flex justify-between">
        <div class="flex gap-3">
          <div class="profile-picture">
            <img class="profile-picture" src="./assets/images/image.svg" alt="profile">
          </div>
          <div class="flex flex-col profile-details">
            <div class="flex gap-2"> 
              <span class="profile-name">user name</span>
              <img class="staus-icon" src="./assets/icons/Accept_icon.png" alt="status">
              <span class="user-name">(user name)</span>
            </div>
            <div class="profile-details">
              user role
            </div>
            <div class="profile-details">
              user location
            </div>
            <button mat-raised-button class="view-mentor-profile flex items-center justify-center pt-2">View Mentor Profile</button>
          </div>
        </div>
        <div class="flex flex-col justify-between items-end">
          <div class="flex">
            <mat-icon class="menu">more_vert</mat-icon>
          </div>
          <div class="flex gap-4 items-center justify-center">
            <button mat-raised-button class="transfor-request flex items-center justify-center">Make Transfor Request</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- #endregion (left profile )-->

  <!-- #region (right profile connections )-->
  <div class="flex flex-col gap-4 items-center justify-center profileRightSection">
    </div>
  <!-- #endregion (right profile connections )-->
</div>
