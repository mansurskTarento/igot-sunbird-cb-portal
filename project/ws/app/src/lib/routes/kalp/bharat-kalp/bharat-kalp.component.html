<sb-uic-bharat-kalp [sectionList]="sectionList" [configDetails]="configService" [bkConfiguration]="bkConfig"
  [individualSection]="individualSection" [communityCardsTemplate]="communityTpl">
</sb-uic-bharat-kalp>

<ng-template #communityTpl let-communities="communities" let-loading="loading">

  <!-- Skeleton while loading -->
  <sb-uic-horizontal-scroller-v2 *ngIf="loading" [id]="'bk-communities-skeleton'" [loadStatus]="'fetching'"
    [widgetsLength]="4" [sliderConfig]="{ showNavs: false, showDots: false }">
    <div class="bk-dv2-comm-item" *ngFor="let s of [1,2,3,4]">
      <d-v2-community-card [isLoading]="true"></d-v2-community-card>
    </div>
  </sb-uic-horizontal-scroller-v2>

  <!-- Real cards -->
  <sb-uic-horizontal-scroller-v2 *ngIf="!loading && communities.length" [id]="'bk-communities'"
    [loadStatus]="'done'" [widgetsLength]="communities.length" [defaultMaxWidgets]="communities.length"
    [sliderConfig]="{ showNavs: true, showDots: true, dotsAlign: 'center', showNavsSpacing: true }">
    <div class="bk-dv2-comm-item" *ngFor="let c of communities" (click)="openCommunity(c)">
      <d-v2-community-card [community]="c" [orgDetails]="c?.additionalInfo || {}">
      </d-v2-community-card>
    </div>
  </sb-uic-horizontal-scroller-v2>

  <!-- Empty state -->
  <div class="bk-comm-empty" *ngIf="!loading && !communities.length">
    <img src="/assets/common/error-pages/empty_search.svg" alt="No communities" class="bk-comm-empty__img">
    <p class="bk-comm-empty__text">No communities available</p>
  </div>

</ng-template>
