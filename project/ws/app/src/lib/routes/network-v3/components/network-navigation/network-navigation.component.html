<div class="navigation-card flex flex-row md:flex-col gap-1 md:p-3">
  <ng-container *ngFor="let item of navigationItems">
    <a [routerLink]="item?.navigationUrl" [queryParams]="item?.queryParams" routerLinkActive="active"
      class="navigation-item flex items-center justify-between gap-2 pl-2 pr-3 rounded hover:bg-gray-200">
      <div class="flex flex-col md:flex-row items-center gap-2">
        <ng-container *ngIf="item?.icon; else routImg">
          <mat-icon class="route-icons">
            {{ item?.icon }}
          </mat-icon>
        </ng-container>
        <ng-template #routImg>
          <img class="route-icons" [src]="item?.imageUrl" alt="route icon">
        </ng-template>
        {{ item?.name | translate }}
      </div>
      <ng-container *ngIf="item?.showUpdate">
        <div class="redDaught"></div>
      </ng-container>
    </a>
  </ng-container>
</div>
