<div class="w-full flex justify-between gap-4 py-3" [ngClass]="{'border-b': showBorder}">
  <!-- #region (user details) -->
   <div class="flex gap-2">
    <div class="profile-iamge">
      <ws-widget-avatar-photo 
        [photoUrl]="otherUserProfile?.profileImageUrl"
        [initials]="nameInitials"
        [name]="otherUserProfile?.fullName"
        [size]="'round-m'"
      ></ws-widget-avatar-photo>
    </div>

    <div class="user-details flex flex-col gap-1">
      <div class="user-name">{{ otherUserProfile?.fullName }}"</div>
      <div class="user-designation">{{ otherUserProfile?.professionalDetails?.[0]?.designation }}</div>
      <div class="organisation">{{ otherUserProfile?.professionalDetails?.[0]?.organisationType }}</div>
      <div class="location">{{ otherUserProfile?.location }} </div>
    </div>
  </div>
   <!-- #endregion (user details) -->

   <!-- #region (status and actions) -->
    <div class="flex justify-center items-center action-buttons h-full" [ngSwitch]="currentTab">
      <ng-container *ngSwitchCase="'connections'">
        <div class="flex w-full gap-8 justify-center items-center">
           <a class="flex gap-1 items-center action-link">
              View Profile
            </a>

          <div class="flex justify-center items-center" [matMenuTriggerFor]="connectionsMenu">
            <mat-icon class="connectionsMenuIcon">more_vert</mat-icon>
          </div>
          <mat-menu #connectionsMenu="matMenu">
            <button mat-menu-item class="menu-item" (click)="copyProfile()">
              <span>copy profile link</span>
            </button>
            <ng-container *ngIf="!otherUserProfile?.connectionStatus">
              <button mat-menu-item class="menu-item" (click)="updateConnection('Removed')">
                <span>Remove connection</span>
              </button>
            </ng-container>
          </mat-menu>
        </div>
      </ng-container>

      <ng-container *ngSwitchCase="'request'">
        <div class="w-full flex flex-col gap-4">
          <div class="flex h-full flex-col w-full">
            <div class="flex justify-end timing">{{otherUserProfile?.timeAgo}}</div>
          </div>
          <ng-container *ngIf="!otherUserProfile?.connectionStatus; else connectionUpdated">
            <div class="request-btns flex justify-between w-full items-center">
              <a class="ignore flex justify-center items-center" (click)="updateConnection('Rejected')">Ignore</a>
              <button mat-button class="accept-btn" (click)="updateConnection('Approved')">Accept</button>
            </div>
          </ng-container>
          <ng-template #connectionUpdated>
            <div class="request-btns flex justify-end w-full items-center">
              <ng-container *ngIf="otherUserProfile?.connectionStatus === 'Approved'; else ignoredTemplate">
                <button mat-button class="request-btns accept-btn action-link-disabled">Accepted</button>
              </ng-container>
              <ng-template #ignoredTemplate>
                <ng-container *ngTemplateOutlet="disableLink; context: { message: 'Ignored' }"></ng-container>
              </ng-template>
            </div>
          </ng-template>
            
        </div>
      </ng-container>

      <ng-container *ngSwitchCase="'sent'">
        <ng-container *ngIf="!otherUserProfile?.connectionStatus; else withdrawnTemplate">
          <div class="flex w-full justify-center items-center">
            <a class="flex gap-1 items-center action-link" (click)="updateConnection('Withdrawn')">
                Withdraw
              </a>
          </div>
        </ng-container>
        <ng-template #withdrawnTemplate>
          <ng-container *ngTemplateOutlet="disableLink; context: { message: 'Withdrawn' }"></ng-container>
        </ng-template>
      </ng-container>

      <ng-container *ngSwitchCase="'blocked'">
        <ng-container *ngIf="!otherUserProfile?.connectionStatus; else blockedTemplate">
          <div class="flex w-full justify-center items-center">
            <a class="flex gap-1 items-center action-link" (click)="updateConnection('Unblocked')">
                Unblock
              </a>
          </div>
        </ng-container>
        <ng-template #blockedTemplate>
          <ng-container *ngTemplateOutlet="disableLink; context: { message: 'Unblocked' }"></ng-container>
        </ng-template>
      </ng-container>
    </div>
    <!-- #endregion (status and actions) -->
</div>

<ng-template #disableLink let-message="message">
  <a class="flex gap-1 items-center action-link action-link-disabled">
    {{message}}
  </a>
</ng-template>
