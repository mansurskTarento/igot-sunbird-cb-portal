<div class="survey-questions">
  <div class="course-info">
    <strong>Content:</strong> {{ courseName }}
  </div>

  <div *ngFor="let question of questions; let i = index" class="question-block">
    <div class="question-text">
      {{ i + 1 }}.{{ question.text }} <span class="required" *ngIf="question.required">*</span>
    </div>

    <!-- Numeric Rating Question -->
    <div *ngIf="question.type === 'numericRating'" class="rating-container">
      <span class="rating-label">{{ question.minLabel || 'NOT AT ALL' }}</span>
      <div class="rating-buttons">
        <button *ngFor="let rating of getRatingArray(question.ratingCount)" type="button"
          [class.selected]="isRatingSelected(i, rating)" (click)="selectRating(i, rating)" class="rating-btn">
          {{ rating }}
        </button>
      </div>
      <span class="rating-label rating-label-max">{{ question.maxLabel || 'VERY CONFIDENT' }}</span>
    </div>

    <!-- TextArea Question -->
    <div *ngIf="question.type === 'textArea'" class="text-container">
      <textarea [formControl]="responses.at(i)" [maxlength]="question.maxLength || 300" rows="4" class="text-input"
        placeholder="Type your response here..."></textarea>
      <div class="char-count">
        {{ responses.at(i).value?.length || 0 }}/{{ question.maxLength || 300 }}
      </div>
    </div>

    <!-- Radio Question -->
    <div *ngIf="question.type === 'radio'" class="single-select-container">
      <mat-radio-group [formControl]="responses.at(i)" class="radio-group">
        <div *ngFor="let option of question.options" class="option-card"
          [class.selected]="responses.at(i).value === option" (click)="responses.at(i).setValue(option)">
          <mat-radio-button [value]="option" class="radio-option">
            <span class="option-label">{{ option }}</span>
          </mat-radio-button>
        </div>
      </mat-radio-group>
    </div>

    <!-- Checkbox Question -->
    <div *ngIf="question.type === 'checkbox'" class="multi-select-container">
      <div *ngFor="let option of question.options" class="option-card checkbox-card"
        [class.selected]="isOptionSelected(i, option)" (click)="toggleOption(i, option, !isOptionSelected(i, option))">
        <mat-checkbox [checked]="isOptionSelected(i, option)"
          (click)="$event.stopPropagation(); toggleOption(i, option, !isOptionSelected(i, option))"></mat-checkbox>
        <div class="option-label">{{ option }}</div>
      </div>
    </div>
  </div>
</div>
