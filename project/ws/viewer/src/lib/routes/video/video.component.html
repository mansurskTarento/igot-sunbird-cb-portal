<ng-container *ngIf="isFetchingDataComplete">
  <viewer-video-container
  [isNotEmbed]="isNotEmbed"
  [isScreenSizeSmall]="isScreenSizeSmall"
  [isFetchingDataComplete]="isFetchingDataComplete"
  [videoData]="videoData"
  [widgetResolverVideoData]="widgetResolverVideoData"
  
  [forPreview]="forPreview"
></viewer-video-container>
</ng-container>
