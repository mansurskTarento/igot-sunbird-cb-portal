<div class="widget-card-content-new">
  <ng-container *ngIf="widgetData" [ngSwitch]="((widgetData && widgetData?.cardSubType) || 'cardStandard')">
    <ng-container *ngSwitchCase="'card-event-v2'" [ngTemplateOutlet]="cardEventV2"></ng-container>
    <ng-container *ngSwitchCase="'card-event-v2-skeleton'" [ngTemplateOutlet]="cardEventV2Skeleton"></ng-container>
  </ng-container>
</div>

<ng-template #cardEventV2>
  dfd
</ng-template>

<ng-template #cardEventV2Skeleton>
  <mat-card class="card-resource-container mr-5 padding-remove  {{ widgetData?.cardCustomeClass}}">
    <div class="display-contents">
      <ng-container *ngIf="!isCardFlipped">
        <mat-card-content class="min-top">
          <div style="position: relative; z-index: 1;">
            <ng-container>
              <ws-widget-skeleton-loader [width]="widgetData?.cardCustomeClass ? '272px':'384px'" [height]="'150px'"
                [bindingClass]="'flex rounded card-img'"></ws-widget-skeleton-loader>
            </ng-container>
          </div>
          <div class="padding-m">
            <div class="course_widget flex margin-remove">
              <div class="flex flex-end mb-2">
                <ws-widget-skeleton-loader [width]="'150px'" [height]="'16px'"
                  [bindingClass]="'flex mr-4'"></ws-widget-skeleton-loader>
              </div>
            </div>
            <div class="mat-subheading-1 title-text ws-mat-text-block-fade-gradient  mb-4">
              <ws-widget-skeleton-loader [width]="'100%'" [height]="'16px'"
                [bindingClass]="'flex'"></ws-widget-skeleton-loader>
              <ws-widget-skeleton-loader [width]="'100%'" [height]="'32px'"
                [bindingClass]="'flex rounded margin-top-s'"></ws-widget-skeleton-loader>
            </div>
            <div class="flex w-full flex-wrap flex-middle margin-top-s">
              <div class="">
                <ws-widget-skeleton-loader [width]="'15px'" [height]="'15px'"
                  [bindingClass]="'flex rounded'"></ws-widget-skeleton-loader>
              </div>
              <span class="org-text"> <ws-widget-skeleton-loader [width]="'200px'" [height]="'15px'"
                  [bindingClass]="'flex rounded'"></ws-widget-skeleton-loader></span>
            </div>
            <div class="flex w-full flex-wrap flex-middle margin-top-s">
              <div class="">
                <ws-widget-skeleton-loader [width]="'16px'" [height]="'16px'"
                  [bindingClass]="'flex rounded'"></ws-widget-skeleton-loader>
              </div>
              <span class="org-text"> <ws-widget-skeleton-loader [width]="'200px'" [height]="'16px'"
                  [bindingClass]="'flex rounded'"></ws-widget-skeleton-loader></span>
            </div>
            <div class="flex w-full flex-wrap flex-middle margin-top-s">
              <div class="">
                <ws-widget-skeleton-loader [width]="'16px'" [height]="'16px'"
                  [bindingClass]="'flex rounded'"></ws-widget-skeleton-loader>
              </div>
              <span class="org-text"> <ws-widget-skeleton-loader [width]="'200px'" [height]="'16px'"
                  [bindingClass]="'flex rounded'"></ws-widget-skeleton-loader></span>
            </div>
          </div>
        </mat-card-content>
      </ng-container>
    </div>
  </mat-card>
</ng-template>
